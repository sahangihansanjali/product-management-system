<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Product Form - Product Management</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="product-form-container">

    <div class="product-form-header">

        <h1 th:if="${product.id == null}">
            Add New Product
        </h1>

        <h1 th:if="${product.id != null}">
            Edit Product
        </h1>

        <p>
            Enter the product details below
        </p>

    </div>


    <form action="/products/save"
          method="post"
          th:object="${product}"
          class="product-form">

        <input type="hidden" th:field="*{id}">


        <!-- Product Name -->

        <div class="form-group">

            <label>Product Name</label>

            <input type="text"
                   th:field="*{name}"
                   placeholder="Enter product name"
                   required
                   minlength="2">

            <span th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}"
                  class="error-message">
            </span>

        </div>


        <!-- Price -->

        <div class="form-group">

            <label>Price</label>

            <input type="number"
                   step="0.01"
                   min="0.01"
                   th:field="*{price}"
                   placeholder="Enter price"
                   required>

            <span th:if="${#fields.hasErrors('price')}"
                  th:errors="*{price}"
                  class="error-message">
            </span>

        </div>


        <!-- Quantity -->

        <div class="form-group">

            <label>Quantity</label>

            <input type="number"
                   min="1"
                   th:field="*{quantity}"
                   placeholder="Enter quantity"
                   required>

            <span th:if="${#fields.hasErrors('quantity')}"
                  th:errors="*{quantity}"
                  class="error-message">
            </span>

        </div>


        <!-- Buttons -->

        <div class="form-buttons">

            <button type="submit">
                Save Product
            </button>

            <a href="/products">
                <button type="button" class="cancel-button">
                    Cancel
                </button>
            </a>

        </div>

    </form>


    <div class="back-section">

        <a href="/products">
            ← Back to Products
        </a>

    </div>

</div>

</body>

</html>
